[project]
name = "financial-rag"
version = "0.1.0"
description = "Multi-agent RAG system for SEC filing analysis"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "google-genai>=1.0.0",
    "qdrant-client>=1.12.1,<1.13.0",
    "sentence-transformers>=3.3.1",
    "rank-bm25>=0.2.2",
    "yfinance>=0.2.51",
    "requests>=2.32.3",
    "httpx>=0.28.1",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "streamlit>=1.41.1",
    "structlog>=24.4.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "tenacity>=9.0.0",
    "numpy>=1.26.4",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "respx>=0.22.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# numpy's bundled .pyi stubs use 3.12+ `type` statement syntax regardless of the
# python_version target above; don't fail the whole run parsing a third-party stub.
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
